name: Python CI

permissions:
  contents: read
  id-token: write  # Required for OIDC login
  packages: write

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      # This input is defined but will be IGNORED by the script logic below 
      image_tag:
        description: 'Tag (Script-Driven Versioning Only)'
        required: false
        default: 'script-only'

jobs:
  # Job 1: Build and Test (CI)
  build-and-test:
    runs-on: windows-latest # Runs on Windows runner
    strategy:
      matrix:
        python-version: ['3.10']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        # Fail on critical errors
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Check style, complexity, and line length (exit-zero shows warnings without failing the job)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test with unittest
      run: python -m unittest discover

  # Job 2: Docker Image Creation and Upload (CD)
  upload-and-deploy:
    needs: build-and-test  # ONLY runs if build-and-test succeeds
    runs-on: ubuntu-latest # Runs on Ubuntu runner for Docker
    # Triggers: Manual (workflow_dispatch), Push to any branch, or Pull Request to main
    if: ${{ success() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') }}

    env:
      AWS_REGION: "eu-north-1"
      ECR_REPO: "breast-cancer-api" # Confirmed ECR repository name

    steps:
      - uses: actions/checkout@v4

      # 1. Determine the image tag ONLY from the version_number.sh script
      - name: Determine Image Tag from Script
        id: determine_tag
        run: |
          # Define the fixed prefix for the tag
          TAG_PREFIX="ml_model_breast_cancer"

          # Execute your script and capture its version
          SCRIPT_VERSION=$(/bin/bash version_number.sh)
          FINAL_TAG="latest" # Fallback value
          
          # Initialize FINAL_TAG with a unique, informative default/fallback
          FINAL_TAG="${TAG_PREFIX}_latest"

          # Prioritization: If the script returns a version, use it. Otherwise, use 'latest'.
          if [[ -n "$SCRIPT_VERSION" ]]; then
            FINAL_TAG="${TAG_PREFIX}_$SCRIPT_VERSION"
          fi
          
          echo "Image Tag set to: $FINAL_TAG (Source: Script or Default)"
          # Export the variable to $GITHUB_ENV for use in subsequent steps (Docker tags)
          echo "IMAGE_TAG=$FINAL_TAG" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # --- DockerHub Login ---
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --- Build & Push to DockerHub ---
      - name: Build and push DockerHub image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Use the environment variable set by the previous step
          tags: ${{ secrets.DOCKER_USERNAME }}/breast-cancer-api:${{ env.IMAGE_TAG }}

      # --- AWS OIDC Auth ---
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::889597770829:role/github-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      # --- Login to Amazon ECR ---
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --- Build & Push to ECR ---
      - name: Build and push to Amazon ECR
        id: ecr_push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Use the registry URL output from the login step and the determined IMAGE_TAG
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}